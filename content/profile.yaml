bio: |
  I'm a full-stack developer. I've shipped an operations ERP, a payroll system, a delivery service,
  e-commerce and booking platforms, dashboards and a few tools built for fun, and I like every part of
  that work: the interface people touch, the API behind it, the data model under it, and the tests that
  keep it honest.

  I work across the whole lifecycle. I start in Figma, build in React and Next.js with Node, NestJS or
  FastAPI behind them, keep data in Postgres or MongoDB, write Playwright and Vitest suites, and deploy
  on Vercel, Render or AWS. I care about what happens after launch: role-based access, audit trails,
  performance budgets and clear documentation.

  I studied Computer Science at St. Aloysius College, Jabalpur. I'm currently a Full Stack Developer
  Intern at SKOPE Kitchens in Bengaluru and a remote Software Development Intern with HASVIK
  Technologies, and I'm open to full-time roles.
