bio: |
  I'm a full-stack developer who likes the unglamorous parts of software: the ledger that has to
  balance, the payroll that has to match to the paisa, the booking that must never double-book.

  I work across the whole lifecycle (design in Figma, build in React/Next.js and Node or Python,
  test with Playwright, deploy on Vercel, Render or AWS) and I care about what happens after launch:
  role-based access, audit trails and tests that prove the numbers.

  I studied Computer Science at St. Aloysius College, Jabalpur, and I'm currently a Full Stack
  Developer Intern at SKOPE Kitchens in Bengaluru, after a software development internship with HASVIK Technologies.
