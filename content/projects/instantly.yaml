title: Instantly
kind: personal
featured: true
order: 4
year: 2026
role: "Solo build: design, frontend, backend, deployment"
tagline: A full-stack grocery store with Stripe, S3 and an AI copywriter for admins.
summary: An AI-assisted e-commerce platform with guest and signed-in carts, Stripe checkout (card
  and cash on delivery), order tracking, verified-purchase reviews and an admin portal with
  Gemini-powered product copy.
problem: Build a store that behaves like a real one, where payment status can't be faked, carts
  survive sign-in and admins don't have to write every product description by hand.
approach:
  - Stripe Checkout with signature-verified webhooks as the only source of truth for 'paid', for
    both card and cash-on-delivery orders.
  - Passport.js JWT strategy with the token in an HttpOnly cookie; RBAC splits the user and admin
    panels.
  - Guest cart in Zustand (persisted) that merges into the server cart on sign-in; TanStack Query
    for server state.
  - Controllers stay thin and the business rules live in services, validated with Zod; product
    images go through multer to AWS S3.
  - Gemini via the Vercel AI SDK / AI Gateway rewrites product titles and generates descriptions,
    and the model can be swapped by changing one string.
outcome: Client render time cut by around 25%, checkout latency kept under 400 ms, and server
  response time improved by around 30% after the schema and RBAC work.
