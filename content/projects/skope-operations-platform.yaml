tagline: One immutable stock ledger behind every number in a multi-brand kitchen.
summary: An operations ERP that runs a multi-brand cloud kitchen from purchasing to daily closing.
  Every stock movement is written once to an immutable ledger, so stock, cost and every report are
  calculated from the same source and always agree.
problem: Purchasing, store, kitchens and sales each kept their own numbers, so stock, food cost and
  variance never agreed. The app also had to be used on phones in the kitchen by six very different
  roles, and it had to be trustworthy enough to lock a day's books.
approach:
  - "One ledger: receipts, issues, transfers, production, sales consumption, wastage and adjustments
    are all ledger entries. Stock is entries in minus entries out, and history is never edited."
  - Sales consume recipes. Posting a sale subtracts ingredients through the recipe and its
    sub-recipes (using each sub-recipe's yield %) and checks for shortages first.
  - An approval gate on purchase receipts (full, partial or reject), supply-chain rules between Main
    Store, Base Kitchen and Normal Kitchens, and daily closing that compares physical counts with
    the ledger and locks the day.
  - "Roles are enforced twice: a route guard in the UI and a 403 on the server for anything outside
    the role."
myWork:
  - Migrated the frontend from Create React App to Vite 8 after the old build failed on a fresh
    install.
  - Made the app usable on phones with swipeable tabs, 44px touch targets, one-column forms and
    scroll hints on wide tables, audited at 360–768px with no sideways overflow.
  - Added a route guard that closed a role-access gap, plus an error screen after fixing a crash
    that blanked the app.
  - Wrote the browser test suite (464 checks across all six roles on desktop and phone) that
    verifies exact ledger numbers after every step.
outcome: The whole purchase-to-closing flow passes end to end for all six roles on desktop and
  phone, with the numbers checked against the ledger at every step.
