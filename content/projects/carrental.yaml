title: CarRental
kind: personal
featured: true
order: 5
year: 2025
role: Solo build
tagline: Luxury car rental with a 3D hero and booking logic that refuses overlapping dates.
summary: A two-sided car rental platform. Customers search by location and dates and book; owners
  list cars, toggle availability and manage bookings and revenue from a dashboard.
problem: "Two kinds of users with different powers, and one rule that must never break: a car can't
  be booked twice for overlapping dates."
approach:
  - 14+ REST endpoints covering listings, bookings, availability and owner management.
  - Date-range validation on the server blocks overlapping bookings; the server calculates the total
    price.
  - Separate JWT-secured access for users and owners, with bcrypt-hashed passwords.
  - ImageKit auto-resizes and compresses vehicle images to 1280px WebP; a React Three Fiber hero
    renders a 3D car.
outcome: A complete customer and owner flow, from search to booking to an owner revenue view.
metrics:
